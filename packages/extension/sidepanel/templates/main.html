            <main class="main-content">

                <!-- Chat Interface -->
                <div id="chatInterface" class="chat-area">
                    <!-- Agent Nav (when subagents active) -->
                    <div id="agentNav" class="agent-nav hidden">
                        <div
                            class="agent-nav-item main-agent active"
                            data-agent="main"
                        >
                            <span class="agent-status"></span>
                            <span>主会话</span>
                        </div>
                    </div>

                    <!-- Empty state -->
                    <div id="chatEmptyState" class="chat-empty-state">
                        <div class="chat-empty-orb"></div>
                        <div class="chat-empty-title">随时待命</div>
                        <div class="chat-empty-subtitle">
                            随意提问或添加标签页/文件以获取更丰富的上下文。
                        </div>
                    </div>

                    <!-- Messages -->
                    <div id="chatMessages" class="chat-messages"></div>

                    <!-- Plan Drawer (above composer) -->
                    <div id="planDrawer" class="plan-drawer hidden">
                        <div class="plan-drawer-header" id="planDrawerToggle">
                            <div class="plan-drawer-title">
                                <svg class="plan-drawer-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                                <span>计划</span>
                                <span class="plan-drawer-count" id="planStepCount">0 个步骤</span>
                            </div>
                            <div class="plan-drawer-actions">
                                <button class="plan-drawer-btn" id="planClearBtn" title="清除计划">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="plan-drawer-content" id="planDrawerContent">
                            <ol class="plan-checklist" id="planChecklist"></ol>
                        </div>
                    </div>

                    <!-- Jump to latest button -->
                    <button id="scrollToLatestBtn" class="jump-to-latest hidden">
                        跳至最新
                    </button>

                    <!-- Composer -->
                    <div class="composer-wrapper">
                        <div id="selectedTabsBar" class="selected-tabs content-column hidden"></div>
                        <div id="recordingTimer" class="recording-timer hidden">
                            <span class="recording-dot"></span>
                            <span class="recording-time">0:00 / 1:00</span>
                        </div>
                        <div id="recordedContextBadge" class="recorded-context-badge hidden">
                            <span class="recording-dot"></span>
                            <span class="recorded-context-label">已附加录制</span>
                            <button id="recordedContextRemove" class="recorded-context-remove">&times;</button>
                        </div>
                        <div id="composer" class="composer content-column">
                            <textarea
                                id="userInput"
                                placeholder="发送消息..."
                                rows="1"
                            ></textarea>
                            <div class="composer-toolbar">
                                <div class="composer-toolbar-left">
                                    <div id="statusBar" class="composer-status">
                                        <span id="statusDot" class="status-dot"></span>
                                        <span id="statusText">就绪</span>
                                        <span id="statusMeta" class="status-meta"></span>
                                    </div>
                                </div>
                                <div class="composer-toolbar-right">
                                    <button
                                        id="fileBtn"
                                        class="icon-btn"
                                        title="附加文件"
                                        data-tooltip="附加文件"
                                    >
                                        <svg
                                            width="15"
                                            height="15"
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="1.75"
                                        >
                                            <path
                                                d="M21.44 11.05 12.36 20.12a5 5 0 0 1-7.07-7.07l8.49-8.49a3 3 0 0 1 4.24 4.24L9.76 17.12a1 1 0 0 1-1.41-1.41l7.07-7.07"
                                            />
                                        </svg>
                                    </button>
                                    <input
                                        id="fileInput"
                                        type="file"
                                        multiple
                                        accept=".md,.txt,.csv,.json,.log"
                                        class="hidden"
                                    />
                                    <button id="recordBtn" class="icon-btn record-btn" title="录制上下文" data-tooltip="录制上下文">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                            <circle cx="12" cy="12" r="7"/>
                                        </svg>
                                    </button>
                                    <button
                                        id="tabSelectorBtn"
                                        class="icon-btn tab-selector-btn"
                                        title="选择标签页"
                                        data-tooltip="选择标签页作为上下文"
                                    >
                                        <svg
                                            width="15"
                                            height="15"
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="1.75"
                                        >
                                            <rect
                                                x="3"
                                                y="3"
                                                width="18"
                                                height="18"
                                                rx="2"
                                            />
                                            <line
                                                x1="3"
                                                y1="9"
                                                x2="21"
                                                y2="9"
                                            />
                                            <line
                                                x1="9"
                                                y1="21"
                                                x2="9"
                                                y2="9"
                                            />
                                        </svg>
                                    </button>
                                    <button
                                        id="exportBtn"
                                        class="icon-btn export-btn"
                                        title="导出对话"
                                        data-tooltip="导出对话"
                                    >
                                        <svg
                                            width="16"
                                            height="16"
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="2"
                                        >
                                            <path
                                                d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
                                            />
                                            <polyline
                                                points="7 10 12 15 17 10"
                                            />
                                            <line
                                                x1="12"
                                                y1="15"
                                                x2="12"
                                                y2="3"
                                            />
                                        </svg>
                                    </button>
                                    <div class="zoom-controls" title="调整字体大小">
                                        <button id="zoomOutBtn" class="zoom-btn" type="button" aria-label="Zoom out">
                                            A-
                                        </button>
                                        <button id="zoomResetBtn" class="zoom-btn zoom-reset" type="button" aria-label="Reset zoom">
                                            A
                                        </button>
                                        <button id="zoomInBtn" class="zoom-btn" type="button" aria-label="Zoom in">
                                            A+
                                        </button>
                                    </div>
                                    <button
                                        id="setupAccessBtn"
                                        class="setup-access-btn hidden"
                                        title="设置访问"
                                        type="button"
                                    >
                                        付费或添加您自己的密钥
                                    </button>
                                    <div
                                        id="modelSelectorWrap"
                                        class="model-selector"
                                        title="切换配置"
                                    >
                                        <select id="modelSelect">
                                            <option value="">
                                                配置
                                            </option>
                                        </select>
                                        <svg
                                            class="model-selector-chevron"
                                            width="12"
                                            height="12"
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="2"
                                        >
                                            <polyline points="6 9 12 15 18 9" />
                                        </svg>
                                    </div>
                                    <button
                                        id="sendBtn"
                                        class="send-btn"
                                        title="发送"
                                    >
                                        <svg class="send-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                            <line x1="12" y1="19" x2="12" y2="5"/>
                                            <polyline points="5 12 12 5 19 12"/>
                                        </svg>
                                        <svg class="stop-icon" width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                                            <rect x="4" y="4" width="16" height="16" rx="2" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- FAB Group - Top right -->
                <div class="fab-group">
                    <!-- Session Tabs Orb -->
                    <div id="sessionTabsHud" class="session-tabs-orb hidden">
                        <div id="sessionTabsList" class="session-tabs-list"></div>
                        <button class="session-tabs-orb-btn" id="sessionTabsToggle" title="浏览器标签页" type="button">
                            <img id="sessionTabsFavicon" class="session-tabs-orb-favicon" alt="" />
                            <svg class="session-tabs-orb-fallback" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="3"/>
                                <line x1="3" y1="9" x2="21" y2="9"/>
                                <line x1="9" y1="3" x2="9" y2="9"/>
                            </svg>
                        </button>
                    </div>

                    <button id="openSidebarBtn" class="settings-fab" title="设置" type="button" data-tooltip="设置" data-tooltip-pos="below">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                            <circle cx="12" cy="12" r="3" />
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                        </svg>
                    </button>
                    <button id="historyFab" class="history-fab" title="历史记录" type="button" data-tooltip="历史记录" data-tooltip-pos="below">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <polyline points="12 6 12 12 16 14" />
                        </svg>
                    </button>
                    <button id="newSessionFab" class="new-session-fab" title="新建会话" type="button" data-tooltip="新建会话" data-tooltip-pos="below">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14" />
                            <path d="M5 12h14" />
                        </svg>
                    </button>
                </div>

                <!-- History Drawer Overlay -->
                <div id="historyDrawer" class="history-drawer hidden">
                    <div class="history-drawer-header">
                        <span class="history-drawer-title">历史记录</span>
                        <div class="history-drawer-actions">
                            <button id="drawerClearHistoryBtn" class="btn btn-secondary">清除</button>
                            <button id="drawerNewSessionBtn" class="btn btn-primary">+ 新建</button>
                            <button id="closeHistoryDrawerBtn" class="icon-btn" title="关闭">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="18" y1="6" x2="6" y2="18" />
                                    <line x1="6" y1="6" x2="18" y2="18" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="history-drawer-search">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                        <input id="historySearchInput" type="text" placeholder="搜索对话..." />
                    </div>
                    <div id="historyDrawerItems" class="history-drawer-list"></div>
                </div>
                <div id="historyDrawerScrim" class="history-drawer-scrim hidden"></div>

                <div id="imagePickerModal" class="image-picker-modal hidden">
                    <div class="image-picker-backdrop"></div>
                    <div class="image-picker-content">
                        <div class="image-picker-header">
                            <span>预览录制</span>
                            <span id="imagePickerCount" class="review-action-count"></span>
                        </div>
                        <div class="review-tabs">
                            <button id="reviewTabActions" class="review-tab active">操作</button>
                            <button id="reviewTabScreenshots" class="review-tab">截图</button>
                        </div>
                        <div id="reviewActionsPanel" class="review-panel">
                            <div id="actionTimelineContainer" class="action-timeline"></div>
                        </div>
                        <div id="reviewScreenshotsPanel" class="review-panel hidden">
                            <div id="imagePickerGrid" class="image-picker-grid"></div>
                        </div>
                        <div class="image-picker-footer">
                            <button id="imagePickerCancel" class="btn btn-secondary">取消</button>
                            <div class="review-footer-right">
                                <button id="reviewAttachOnlyBtn" class="btn btn-secondary">仅附加</button>
                                <button id="reviewSaveSkillBtn" class="btn btn-primary">保存技能</button>
                            </div>
                        </div>
                    </div>
                </div>

            </main>
